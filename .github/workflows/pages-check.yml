name: Check Pages assembly

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test production and preview assembly with real rsync
        run: python3 tests/pages_assembly_test.py
